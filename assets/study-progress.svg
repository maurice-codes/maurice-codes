<svg xmlns="http://www.w3.org/2000/svg" width="600" height="110" viewBox="0 0 600 110">
  <defs>
    <linearGradient id="fill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#A7D8FF"/>
      <stop offset="100%" stop-color="#5AB4F0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barClip">
      <rect x="20" y="52" width="499.9" height="22" rx="11">
        <animate attributeName="width" from="0" to="499.9" dur="1.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .title { font: 600 16px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #5AB4F0; }
    .pct   { font: 700 16px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #5AB4F0; }
    .small { font: 400 12px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #8AA4B8; }
    .fade  { opacity: 0; animation: fadeIn 0.8s ease-out 1.2s forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>

  <text x="20" y="36" class="title">🎓 B.Sc. Computer Science</text>
  <text x="580" y="36" class="pct fade" text-anchor="end">89.3%</text>

  <rect x="20" y="52" width="560" height="22" rx="11" fill="#E0F4FF"/>
  <g clip-path="url(#barClip)">
    <rect x="20" y="52" width="560" height="22" fill="url(#fill)"/>
    <rect x="-120" y="52" width="120" height="22" fill="url(#shine)">
      <animate attributeName="x" from="-120" to="580" dur="2.5s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="20" y="96" class="small">01.10.2023</text>
  <text x="300" y="96" class="small fade" text-anchor="middle">137 days to go</text>
  <text x="580" y="96" class="small" text-anchor="end">31.03.2027</text>
</svg>
